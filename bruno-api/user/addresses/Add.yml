info:
  name: Add
  type: http
  seq: 1

http:
  method: POST
  url: "{{Local_URL}}user/address"
  body:
    type: form-urlencoded
    data:
      - name: firstname
        value: Priya
      - name: lastname
        value: Kumar
      - name: company_name
        value: Flipkart
      - name: street
        value: Peeragarhi
      - name: city
        value: New Delhi
      - name: state
        value: Delhi
      - name: country
        value: India
      - name: zip_code
        value: "110083"
      - name: phone
        value: "9876543210"
      - name: landmark
        value: Near Metro Station
      - name: type
        value: home
      - name: isDefault
        value: "true"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
